name: Flake Update Staging

on:
  schedule:
    - cron: "0 4 */3 * *" # Every 3 days at 4 AM UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write # Needed for label operations

concurrency:
  group: flake-update-staging
  cancel-in-progress: true

jobs:
  create-staging-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Configure git auth for push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Ensure required labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "staging-pending" --color "0E8A16" \
            --description "Staged flake update — awaiting Hydra status check" 2>/dev/null || true
          gh label create "ndrwstn" --color "BFD4F2" \
            --description "Misc/uncategorized nix changes" 2>/dev/null || true

      - name: Update all flake inputs
        run: nix flake update

      - name: Update broadcom-sta pin
        run: python3 scripts/update-broadcom-pin.py

      - name: Validate flake
        run: nix flake check

      - name: Create staging PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="staging/flake-update-$DATE"

          if git diff --quiet -- flake.lock machines/silver/configuration.nix; then
            echo "No flake or Broadcom changes — nothing to stage"
            exit 0
          fi

          git add flake.lock machines/silver/configuration.nix
          git commit -m "update(lock): refresh flake inputs"
          git push origin HEAD:"$BRANCH" --force

          PR_NUM=$(gh pr list --head "$BRANCH" --state open \
            --json number --jq '.[0].number')
          if [ -z "$PR_NUM" ]; then
            PR_URL=$(gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "update(lock): refresh flake inputs" \
              --body "Auto-merge when Hydra Status Check confirms primary nixpkgs inputs are Hydra/channel-ready.")
            PR_NUM=$(gh pr view "$PR_URL" --json number --jq '.number')
            echo "Created staging PR #$PR_NUM"
          else
            echo "Refreshing existing staging PR #$PR_NUM"
          fi

          gh pr edit "$PR_NUM" --add-label "staging-pending"

          # There must be one active staging PR. Close older ones after the
          # replacement exists, so a failed update never strands the active PR.
          gh pr list --base master --state open --limit 100 \
            --json number,headRefName --jq \
            '.[] | select(.headRefName | startswith("staging/flake-update-")) | [.number, .headRefName] | @tsv' |
            while IFS=$'\t' read -r OLD_NUM OLD_BRANCH; do
              [ "$OLD_NUM" = "$PR_NUM" ] && continue
              echo "Closing superseded staging PR #$OLD_NUM ($OLD_BRANCH)"
              gh pr edit "$OLD_NUM" \
                --remove-label "staging-pending" \
                --add-label "ndrwstn" || true
              gh pr close "$OLD_NUM" \
                --comment "Superseded by staging PR #$PR_NUM ($BRANCH)." || true
            done
